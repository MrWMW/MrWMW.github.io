<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=https://mrwintel.xyz/">
    <link rel="canonical" href="https://mrwintel.xyz/">
    <title>正在前往 MrWintel 的博客</title>
    <script>
      (() => {
        const destination = new URL("https://mrwintel.xyz");
        destination.pathname = window.location.pathname;
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        window.location.replace(destination.href);
      })();
    </script>
  </head>
  <body>
    <p>正在前往 <a href="https://mrwintel.xyz/">mrwintel.xyz</a>…</p>
  </body>
</html>
